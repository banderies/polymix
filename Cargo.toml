[workspace]
resolver = "2"
members = ["crates/mm-core", "crates/mm-edit", "crates/mm-image", "crates/mm-io", "crates/mm-remesh", "crates/mm-repair", "crates/mm-reverse", "crates/mm-segment", "crates/mm-solid", "crates/mm-volume", "crates/polymix", "crates/polymix-imaging", "crates/polymix-mcp", "crates/polymix-segmentation", "crates/polymix-volume", "crates/polymix-workspace"]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "AGPL-3.0-only"

[workspace.dependencies]
glam = { version = "0.34", features = ["bytemuck"] }
rayon = "1.12"
smallvec = { version = "1.15", features = ["union", "const_generics"] }
anyhow = "1"
thiserror = "2"
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence", "system_fonts"] }
log = "0.4"

# The Reverse Engineer workspace's CAD kernel: SolidCraft (MIT OR Apache-2.0), pinned to a public
# revision. Its kernel builds on truck with fixes SolidCraft vendors, so the same patches apply here
# ([patch] is only read from the root workspace).
solidcraft-geom = { git = "https://github.com/tangency-labs/solidcraft", rev = "e4a67d1e30d0e99e849c6397109770f37d476422" }
solidcraft-kernel = { git = "https://github.com/tangency-labs/solidcraft", rev = "e4a67d1e30d0e99e849c6397109770f37d476422" }
solidcraft-sketch = { git = "https://github.com/tangency-labs/solidcraft", rev = "e4a67d1e30d0e99e849c6397109770f37d476422" }

[patch.crates-io]
truck-geometry = { git = "https://github.com/tangency-labs/solidcraft", rev = "e4a67d1e30d0e99e849c6397109770f37d476422" }
truck-shapeops = { git = "https://github.com/tangency-labs/solidcraft", rev = "e4a67d1e30d0e99e849c6397109770f37d476422" }
truck-stepio = { git = "https://github.com/tangency-labs/solidcraft", rev = "e4a67d1e30d0e99e849c6397109770f37d476422" }
truck-meshalgo = { git = "https://github.com/tangency-labs/solidcraft", rev = "e4a67d1e30d0e99e849c6397109770f37d476422" }
matext4cgmath = { git = "https://github.com/tangency-labs/solidcraft", rev = "e4a67d1e30d0e99e849c6397109770f37d476422" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"

# The app bundle's build (scripts/make_app.sh): release, with each workspace library crate
# (mm-*, polymix-imaging, -segmentation, -volume, -mcp and -workspace) compiled as one unit so
# LLVM optimises across its modules: image reslicing runs about a quarter faster and STL
# reading about 15%, the rest the same. It is cheap for the UI library crates too: one unit
# costs them seconds, and with thin LTO an incremental build after a change to mm-core or
# polymix-segmentation was no slower than release's. Dependencies and the polymix binary
# crate, the largest and rebuilt on every change, keep release's 16 units. Panics still
# unwind: the crash guard needs that.
[profile.dist]
inherits = "release"
codegen-units = 1

[profile.dist.package."*"]
codegen-units = 16

[profile.dist.package.polymix]
codegen-units = 16
