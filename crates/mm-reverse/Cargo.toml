[package]
name = "mm-reverse"
description = "Reverse engineering from scans for Polymix (no GUI): sections through a mesh, slice chains cut into lines and arcs, 2D and 3D fits, the sketch model and its solver. A port of ScanRuler's reverse-engineering core."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
mm-core = { path = "../mm-core" }
glam = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true
solidcraft-geom.workspace = true
solidcraft-kernel.workspace = true
solidcraft-sketch.workspace = true
serde_json = "1"
rayon.workspace = true

[dev-dependencies]
mm-io = { path = "../mm-io" }
