[package]
name = "mm-volume"
description = "Volumetric image data for Polymix: find, read and organise DICOM, NIfTI, Analyze and NRRD"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
dicom-core = "0.10"
dicom-object = "0.10"
dicom-dictionary-std = "0.10"
dicom-transfer-syntax-registry = { version = "0.10", default-features = false }
dicom-pixeldata = { version = "0.10", default-features = false, features = ["native"] }
flate2 = "1"
walkdir = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam.workspace = true
rayon.workspace = true
anyhow.workspace = true
log.workspace = true

[dev-dependencies]
# Cross-checks the NIfTI header maths.
nifti = { version = "0.18", default-features = false, features = ["nalgebra_affine"] }
