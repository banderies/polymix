[package]
name = "polymix"
description = "Polymix: an open-source mesh editor in the spirit of Meshmixer"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "polymix"
path = "src/main.rs"

[dependencies]
mm-core = { path = "../mm-core" }
mm-io = { path = "../mm-io" }
mm-remesh = { path = "../mm-remesh" }
mm-repair = { path = "../mm-repair" }
mm-edit = { path = "../mm-edit" }
mm-solid = { path = "../mm-solid" }
glam.workspace = true
rayon.workspace = true
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
polymix-workspace = { path = "../polymix-workspace" }
polymix-volume = { path = "../polymix-volume" }
polymix-segmentation = { path = "../polymix-segmentation" }
bytemuck = { version = "1.25", features = ["derive"] }
rfd = "0.17"
log.workspace = true
env_logger = "0.11"
png = "0.18"
# Project files (.polymix) are zip archives.
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 3D mouse: the 3Dconnexion driver framework is loaded at run time.
libloading = "0.8"
# Scripted test runs open their window without activating the app.
winit = "0.30"
